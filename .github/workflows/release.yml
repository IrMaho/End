name: End Language Global Release Matrix

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
            archive_ext: zip
            binary_name: endc.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            platform: linux-x64
            archive_ext: tar.gz
            binary_name: endc
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
            archive_ext: tar.gz
            binary_name: endc
          - os: macos-13
            target: x86_64-apple-darwin
            platform: macos-x64
            archive_ext: tar.gz
            binary_name: endc

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build Release Binary
        run: |
          cd endc
          cargo build --release --target ${{ matrix.target }}

      - name: Stage Artifacts (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          $pkgName = "end-$ver-${{ matrix.platform }}.zip"
          mkdir staging\bin
          copy endc\target\${{ matrix.target }}\release\endc.exe staging\bin\endc.exe
          copy endc\target\${{ matrix.target }}\release\endc.exe staging\bin\end.exe
          xcopy std staging\std /E /I
          copy README.md staging\
          copy LICENSE staging\
          copy Architecture.toml staging\
          Compress-Archive -Path staging\* -DestinationPath $pkgName
          (Get-FileHash -Path $pkgName -Algorithm SHA256).Hash + "  $pkgName" | Out-File -FilePath "$pkgName.sha256" -Encoding utf8

      - name: Stage Artifacts (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          ver="${{ github.ref_name }}"
          pkgName="end-$ver-${{ matrix.platform }}.tar.gz"
          mkdir -p staging/bin
          cp endc/target/${{ matrix.target }}/release/endc staging/bin/endc
          cp endc/target/${{ matrix.target }}/release/endc staging/bin/end
          cp -r std staging/std
          cp README.md LICENSE Architecture.toml staging/
          tar -czf "$pkgName" -C staging .
          shasum -a 256 "$pkgName" > "$pkgName.sha256"

      - name: Publish Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            end-${{ github.ref_name }}-*.zip
            end-${{ github.ref_name }}-*.tar.gz
            end-${{ github.ref_name }}-*.sha256
            install.ps1
            install.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
