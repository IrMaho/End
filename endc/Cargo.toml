[package]
name = "endc"
version = "2.0.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.1"
toml = "0.8"
sha2 = "0.10"
z3 = "0.20.2"
inkwell = { version = "0.10.0", default-features = false, features = ["llvm22-1-no-llvm-linking", "target-x86"] }

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
